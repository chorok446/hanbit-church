name: Image Verify (develop)

# develop 대상 PR 중 이미지 빌드에 영향 주는 경로가 바뀐 경우에만 Docker 빌드를 검증한다.
# 배경: 프로덕션 이미지 빌드 결함(#62 ISR hang)이 main PR 전용 image-verify 때문에 늦게 발견됐다.
# main 대상 PR 은 기존 image-verify.yml 이 경로 무관 전체 검증한다(릴리스 게이트).

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/api/Dockerfile*"
      - "apps/web/Dockerfile*"
      - "apps/web/next.config.ts"
      - "apps/web/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "apps/api/build.gradle.kts"
      - "apps/api/settings.gradle.kts"
      - ".github/workflows/image-verify-develop.yml"

permissions:
  contents: read

concurrency:
  group: image-verify-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-verify:
    name: ${{ matrix.app }} image
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            context: apps/api
            file: apps/api/Dockerfile.prod
            build-args: ""
          - app: web
            context: .
            file: apps/web/Dockerfile.prod
            build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://ci-build-placeholder.invalid' }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'hanbit-ci-placeholder' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/hanbit-${{ matrix.app }}
          tags: type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
