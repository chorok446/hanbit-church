name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 브랜치/PR에서 새 푸시가 오면 진행 중 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next.js 빌드 캐시: 소스가 바뀌면 갱신, 아니면 복원해 재빌드 단축.
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  # 회원가입→글 작성→피드 핵심 경로 스모크. web 프로덕션 빌드 + api bootRun 을 Playwright webServer 가 띄운다.
  e2e:
    name: e2e (smoke)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dasida
          MYSQL_USER: dasida
          MYSQL_PASSWORD: dasida
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # API 기본 DB 는 3307/cheolma(로컬 docker-compose) 이므로, e2e MySQL 서비스(3306/dasida)에
      # 맞춰 DB env 를 주입한다. 없으면 bootRun 이 Communications link failure 로 기동 실패한다.
      - run: pnpm --filter web e2e
        env:
          DB_URL: jdbc:mysql://localhost:3306/dasida
          DB_USER: dasida
          DB_PASSWORD: dasida
          # e2e 헬퍼가 기대하는 부트스트랩 관리자(e2e-admin@cheolma.local/E2eAdmin1!)를 SeedRunner 로 시드.
          # 없으면 관리자 로그인이 401 로 실패한다(praise-team 등 admin 시드 전제 스펙).
          ADMIN_EMAIL: e2e-admin@cheolma.local
          ADMIN_PASSWORD: E2eAdmin1!
          ADMIN_NAME: e2e관리자
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # 의존성/파일시스템 취약점 스캔. 초기에는 비차단(continue-on-error)으로 리포트만 남긴다.
  security:
    name: security (deps scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm audit runs over the whole JS workspace (web + packages); it has no --filter form.
      # 비차단(continue-on-error): 취약점을 리포트만 하고 빌드는 막지 않는다.
      # (컨테이너 이미지 스캔은 외부 액션 버전 드리프트로 잡이 통째로 실패할 수 있어 후속 과제로 분리)
      - name: pnpm audit (JS workspace, high+)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  api:
    name: api (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        working-directory: apps/api
        run: ./gradlew build --no-daemon

  # develop 대상 Ready PR은 web/api/e2e 검사 통과 후 자동 머지한다.
  # main 대상 PR은 release/deploy gate 이므로 자동 머지하지 않는다(CI + image build 검증만).
  #   main merge 는 수동 승인 후 수행하고, main push CI 성공 시 CD(cd.yml)가 image push 를 수행한다.
  # Dependabot PR은 의존성 검증을 CI에서 돌리되 자동 머지는 하지 않는다(수동 검증 후 처리).
  main-pr-source-gate:
    name: main PR source gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only develop may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main 대상 PR은 develop 브랜치에서만 열 수 있습니다 (head: $HEAD_REF)."
            exit 1
          fi

  automerge:
    name: auto-merge
    needs: [web, api, e2e]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --merge --delete-branch
