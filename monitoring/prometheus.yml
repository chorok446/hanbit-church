# 로컬 모니터링용 Prometheus 설정. docker compose --profile monitoring up -d 로 기동.
# 호스트에서 도는 API(8080)를 컨테이너에서 host.docker.internal 로 스크레이프한다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cheolma-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
