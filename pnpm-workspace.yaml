packages:
  - apps/*
  - packages/*
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true
# 미검토 의존성 설치 스크립트는 실패 처리한다(pnpm 11 기본값을 명시).
strictDepBuilds: true
# PostCSS sourceMappingURL 파일 읽기 취약점(GHSA-fxqj-rqcc-2cmp) 패치 하한.
overrides:
  "postcss@<8.5.23": "^8.5.23"
  # @redocly/openapi-core의 4.2.0 고정 때문에 남는 YAML DoS(GHSA-2883-xcg3-v3hh).
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
